<article class="prop-card">
  <div class="prop-img-wrap">
    <span class="prop-badge new">DESTAQUE</span>
    <img [src]="itemData.imageUrl" [alt]="itemData.description">
  </div>
  <div class="prop-body">
    <p class="prop-title">{{ itemData.description }}</p>
    <div class="prop-features">
      <span class="prop-feature"><i class="bi bi-door-open"></i>Quartos</span>
      <span class="prop-feature"><i class="bi bi-droplet-half"></i>Banhos</span>
    </div>
  </div>
</article>
