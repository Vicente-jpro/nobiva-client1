<div class="filter-group">
  <label class="filter-label">Pesquisar</label>
  <input type="text" class="form-control mt-2"
         placeholder="Título, localidade..."
         [(ngModel)]="filterSearch">
</div>

<div class="filter-group mt-4">
  <label class="filter-label">Tipo de Negociação</label>
  <div class="row g-2 mt-1">
    <div class="col-6">
      <div class="form-check filter-radio-card">
        <input class="form-check-input" type="radio" [value]="''" [(ngModel)]="filterTypeNegociation">
        <label class="form-check-label">Todos</label>
      </div>
    </div>
    <div class="col-6">
      <div class="form-check filter-radio-card">
        <input class="form-check-input" type="radio" [value]="negotiation.VENDA" [(ngModel)]="filterTypeNegociation">
        <label class="form-check-label">Venda</label>
      </div>
    </div>
    <div class="col-6">
      <div class="form-check filter-radio-card">
        <input class="form-check-input" type="radio" [value]="negotiation.ARRENDAMENTO" [(ngModel)]="filterTypeNegociation">
        <label class="form-check-label">Arrendamento</label>
      </div>
    </div>
  </div>
</div>

<div class="filter-group mt-4">
  <label class="filter-label">Província</label>
  <select class="form-select mt-2" [(ngModel)]="filterIdProvince">
    <option [value]="0">Todas</option>
    @for (p of provinceOptions; track p.value) {
      <option [value]="p.value">{{ p.viewValue }}</option>
    }
  </select>
</div>

<div class="filter-group mt-4">
  <label class="filter-label">Faixa de preço</label>
  <div class="row g-2 mt-1">
    <div class="col-6">
      <div class="input-group">
        <span class="input-group-text small">Kz</span>
        <input type="number" class="form-control" placeholder="Mín" [(ngModel)]="filterMinPrice" min="100">
      </div>
    </div>
    <div class="col-6">
      <div class="input-group">
        <span class="input-group-text small">Kz</span>
        <input type="number" class="form-control" placeholder="Máx" [(ngModel)]="filterMaxPrice" min="100">
      </div>
    </div>
  </div>
</div>

<div class="filter-group mt-4">
  <label class="filter-label">Tipologia</label>
  <div class="choice-group mt-2">
    @for (t of tipologyKeys; track t) {
      <button type="button"
              class="filter-chip"
              [class.active]="filterTipologies.includes(t)"
              (click)="toggleTipology(t)">{{ t }}</button>
    }
  </div>
</div>

<button type="button" class="btn btn-accent w-100 mt-4" (click)="applyFilter()">
  <i class="bi bi-sliders2 me-2"></i>Aplicar Filtros
</button>
