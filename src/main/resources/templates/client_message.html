<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="pt">
<head><meta charset="UTF-8"><title>Nova mensagem de cliente</title></head>
<body style="font-family:Arial,sans-serif;color:#222">
  <h2>Nova mensagem recebida</h2>
  <p><strong>Email do cliente:</strong> <span th:text="${senderEmail}"></span></p>
  <p><strong>Assunto:</strong> <span th:text="${subject}"></span></p>
  <p><strong>Mensagem:</strong></p>
  <div style="white-space:pre-wrap" th:text="${description}"></div>
  <p><strong>Data:</strong> <span th:text="${createdAt}"></span></p>
  <p><strong>Referência:</strong> <span th:text="${messageId}"></span></p>
</body>
</html>
