server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  servlet:
    context-path: /api

spring:
  application:
    name: nobiva-api
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
    default-schema: public
    drop-first: false
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 20MB
      max-request-size: 100MB

file:
  upload-dir: ${FILE_UPLOAD_DIR:Documents/fileUploaded}

rabbitmq:
  listener:
    simple:
      retry:
        enabled: true
        max-attempts: 3
        initial-interval: 8000
  queues:
    email-task: email-task
    user-authentication: user-authentication
    notification: notification
    client-messages: client-messages
    client-messages-dlq: client-messages.dlq

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_ACCESS_EXPIRATION_MS:3600000}
    password-reset-expiration: ${JWT_PASSWORD_RESET_EXPIRATION_MS:900000}
    account-confirmation-expiration: ${JWT_ACCOUNT_CONFIRMATION_EXPIRATION_MS:86400000}
  url:
    account:
      change-password: ${FRONTEND_URL:http://localhost:4200}/user/change-password?token=
      confirmation:
        send: ${FRONTEND_URL:http://localhost:4200}/user/confirme-account?token=

app:
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:4200}
  url:
    subscription-payment: ${FRONTEND_URL:http://localhost:4200}/user/subscription
    house-details: ${HOUSE_DETAILS_URL:${FRONTEND_URL:http://localhost:4200}/houses}
  approval-request:
    cooldown-hours: ${APPROVAL_REQUEST_COOLDOWN_HOURS:24}
  client-messages:
    scheduler-delay-ms: ${CLIENT_MESSAGE_SCHEDULER_DELAY_MS:120000}
    batch-size: ${CLIENT_MESSAGE_BATCH_SIZE:50}
    max-attempts: ${CLIENT_MESSAGE_MAX_ATTEMPTS:5}
    consumer-max-attempts: ${CLIENT_MESSAGE_CONSUMER_MAX_ATTEMPTS:3}
    initial-retry-delay-seconds: ${CLIENT_MESSAGE_RETRY_DELAY_SECONDS:120}
    rate-limit-per-minute: ${CLIENT_MESSAGE_RATE_LIMIT_PER_MINUTE:5}
    retention-months: ${CLIENT_MESSAGE_RETENTION_MONTHS:1}
    cleanup-cron: ${CLIENT_MESSAGE_CLEANUP_CRON:0 0 3 * * *}
    cleanup-zone: ${CLIENT_MESSAGE_CLEANUP_ZONE:Africa/Luanda}
jobs:
  subscription:
    daily-cron: ${SUBSCRIPTION_DAILY_CRON:0 0 0 * * *}
    zone: ${SUBSCRIPTION_JOB_ZONE:Africa/Luanda}
